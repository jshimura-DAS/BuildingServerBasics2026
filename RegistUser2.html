<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

            button:hover {
                background-color: #45a049;
            }

        .error {
            color: red;
            font-size: 12px;
            margin-top: 3px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .button-group button,
        .button-group a {
            flex: 1;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            text-align: center;
            cursor: pointer;
        }

        a:hover {
            background-color: #0b7dda;
        }
    </style>
    <script>
		// クライアント側の検証
		function validateForm() {
			const name = document.getElementById('name').value.trim();
			const birthDate = document.getElementById('birthDate').value;

			// 名前が空でないか確認
			if (!name) {
				alert('名前を入力してください');
				return false;
			}

			// 名前が3文字以上か確認
			if (name.length < 2) {
				alert('名前は2文字以上で入力してください');
				return false;
			}

			// 生年月日が入力されているか確認
			if (!birthDate) {
				alert('生年月日を入力してください');
				return false;
			}

			// 生年月日が今日以降ではないか確認
			const birthDateObj = new Date(birthDate);
			const today = new Date();
			if (birthDateObj >= today) {
				alert('生年月日は今日より前の日付を入力してください');
				return false;
			}

			return true;
		}
    </script>
</head>
<body>
    <h1>ユーザー登録</h1>
    <form action="http://172.25.21.148/RegistUser2.php" method="POST" onsubmit="return validateForm()">
        <div class="form-group">
            <label for="name">名前:</label>
            <input type="text" id="name" name="name" placeholder="山田太郎" required>
            <p class="error">※ 2文字以上で入力してください</p>
        </div>

        <div class="form-group">
            <label for="birthDate">生年月日:</label>
            <input type="date" id="birthDate" name="birthDate" required>
            <p class="error">※ 今日より前の日付を入力してください</p>
        </div>

        <button type="submit">登録する</button>
        <button type="reset">クリア</button>
    </form>

    <div class="button-group">
        <a href="chat.html">チャットへ移動</a>
    </div>
</body>
</html>
